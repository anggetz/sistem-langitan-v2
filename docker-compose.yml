services:
  app:
    build:
      context: .
      dockerfile: base.Dockerfile
    container_name: sistem-langitan-v2
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - /root/sistem-langitan-v2/storage/logs:/var/www/html/storage/logs
      - /root/sistem-langitan-v2/storage/app:/var/www/html/storage/app
