name: Auto Merge and Deploy to VPS on PR to Develop

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Check for conflicts
        id: conflict
        run: |
          gh pr view ${{ github.event.pull_request.number }} --json mergeable -q ".mergeable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge PR if no conflicts
        id: automerge
        if: steps.conflict.outputs.mergeable == 'true'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment success auto-merge
        if: steps.automerge.outcome == 'success'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "✅ PR berhasil di auto-merge ke develop."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: automerge
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Check for composer changes
        id: composer
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -q 'composer.json'; then
            echo "composer_changed=true" >> $GITHUB_ENV
          fi

      - name: Check for node changes
        id: node
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -E 'package(-lock)?\.json'; then
            echo "node_changed=true" >> $GITHUB_ENV
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy & Install Dependencies
        id: deploy
        run: |
          ssh -p 2246 -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /var/www/sistem-langitan-v2
          git pull origin develop
          if [ "${{ env.composer_changed }}" = "true" ]; then
            composer install --no-interaction --prefer-dist
          fi
          if [ "${{ env.node_changed }}" = "true" ]; then
            npm install --production
          fi
          php artisan cache:clear || echo "Laravel cache not found or not needed"
          EOF

      - name: Comment success deploy
        if: steps.deploy.outcome == 'success'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🚀 Deploy ke VPS berhasil dilakukan."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
