name: Develop Deployment

on:
  push:
    branches: [ "develop" ]
    
env:
  IMAGE_NAME: "sistem-langitan-v2"    

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if base.Dockerfile has changed
        id: check_file
        run: |
          if git diff --name-only HEAD~1 | grep -q "base.Dockerfile"; then
            echo "base_dockerfile_changed=true" >> $GITHUB_ENV
          else
            echo "base_dockerfile_changed=false" >> $GITHUB_ENV
          fi

      - name: Build base image if base.Dockerfile changed
        if: env.base_dockerfile_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base.Dockerfile
          # PERBAIKAN: Menggunakan format ${{ }} yang benar
          tags: ghcr.io/${{ github.repository_owner }}/sistm-langitan-v2:base
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          # PERBAIKAN: Konsistensi pemanggilan tag
          tags: ghcr.io/${{ github.repository_owner }}/siste-langitan-v2:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          
  deploy-langitan-v2:
    name: Deploy Ke Server Umaha
    needs: build
    runs-on: umaha-development

    steps:
      - name: Run Deployment Script langitan-v2
        run: |
          cd ${{ vars.UMAHA_DEV_APP_PATH }}
          # Login menggunakan GITHUB_TOKEN
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull ${{ vars.SERVICE_NAME_DEV }}
          docker compose up -d --force-recreate --no-deps ${{ vars.SERVICE_NAME_DEV }}
          docker logout ghcr.io
