name: Develop Deployment

on:
  push:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Ref: https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ref: https://github.com/docker/login-action
      - name: Log to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if base.Dockerfile has changed
        run: |
          if git diff --name-only HEAD~1 | grep -q "base.Dockerfile"; then
          echo "base_dockerfile_changed=true" >> $GITHUB_ENV
          else
          echo "base_dockerfile_changed=false" >> $GITHUB_ENV
          fi

      - name: Build base image if base.Dockerfile changed
        if: env.base_dockerfile_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base.Dockerfile
          tags: ghcr.io/$(( vars.IMAGE_NAME )):base
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

      # Ref: https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ghcr.io/${{ vars.IMAGE_NAME }}:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          
  deploy-langitan-v2:
    name: Deploy Ke Server Umaha
    needs: build
    runs-on: umaha-development

    steps:
      - name: Run Deployment Script langitan-v2
        run: |
          cd ${{ vars.UMAHA_DEV_APP_PATH }}
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull ${{ vars.SERVICE_NAME_DEV }}
          docker compose up -d --force-recreate --no-deps ${{ vars.SERVICE_NAME_DEV }}
          docker logout
