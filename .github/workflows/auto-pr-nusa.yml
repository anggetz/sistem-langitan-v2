name: Auto PR NUSAPRAS
on:
  push:
    branches:
      - nusapras

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: nusapras
          base: develop
          title: "Auto PR: Update from nusapras branch"
          body: |
            ## Automatic Pull Request
            
            This PR was automatically created from the `nusapras` branch.
            
            **Changes:** Latest commits from nusapras branch
            **Author:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}
            
            Please review and merge when ready.
          labels: auto-pr
