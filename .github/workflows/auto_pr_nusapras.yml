name: Auto PR from Nusantarapras

on:
  push:
    branches:
      - nusapras

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history untuk compare
          
      - name: Check if PR already exists
        id: check-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:nusantarapras`,
              base: 'develop',
              state: 'open'
            });
            
            console.log(`Found ${pulls.length} existing PRs`);
            return pulls.length > 0;
            
      - name: Get commit info
        id: commit-info
        run: |
          # Get latest commit message
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          echo "commit-message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "commit-author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "commit-hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          
          # Get changes summary
          CHANGES=$(git diff --name-only HEAD~1 HEAD | head -10)
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create Pull Request
        if: steps.check-pr.outputs.result == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: nusantarapras
          base: develop
          title: "🚀 Auto PR: ${{ steps.commit-info.outputs.commit-message }}"
          body: |
            ## 🤖 Automatic Pull Request
            
            **Branch:** `nusantarapras` → `develop`
            
            ### 📝 Latest Commit Details
            - **Message:** ${{ steps.commit-info.outputs.commit-message }}
            - **Author:** ${{ steps.commit-info.outputs.commit-author }}
            - **Hash:** `${{ steps.commit-info.outputs.commit-hash }}`
            
            ### 📋 Changed Files
            ```
            ${{ steps.commit-info.outputs.changes }}
            ```
            
            ### 🔄 Auto-generated
            This PR was automatically created when changes were pushed to `nusantarapras` branch.
            
            ---
            **Triggered by:** Push to nusantarapras  
            **Workflow:** ${{ github.workflow }}  
            **Run ID:** ${{ github.run_id }}
          labels: |
            auto-pr
            nusantarapras
            ready-for-review
          reviewers: |
            # Tambahkan username reviewer default jika diperlukan
          assignees: |
            ${{ github.actor }}
            
      - name: Update existing PR
        if: steps.check-pr.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get existing PR
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:nusantarapras`,
              base: 'develop',
              state: 'open'
            });
            
            if (pulls.length > 0) {
              const prNumber = pulls[0].number;
              
              // Add comment about new push
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `🔄 **New push detected!**
                
                **Latest commit:** \`${{ steps.commit-info.outputs.commit-hash }}\`
                **Message:** ${{ steps.commit-info.outputs.commit-message }}
                **Author:** ${{ steps.commit-info.outputs.commit-author }}
                
                **Changed files:**
                \`\`\`
                ${{ steps.commit-info.outputs.changes }}
                \`\`\`
                
                PR updated automatically.`
              });
              
              console.log(`Updated existing PR #${prNumber}`);
            }
            
      - name: Notify success
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const action = '${{ steps.check-pr.outputs.result }}' === 'false' ? 'created' : 'updated';
            console.log(`✅ Pull request ${action} successfully!`);
