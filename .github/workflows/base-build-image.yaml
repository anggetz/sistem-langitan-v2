name: Build base image

on:
  push:
    paths:
      - 'base.Dockerfile~disabled'

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ref: https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ref: https://github.com/docker/login-action
      - name: Log to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      # Ref: https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ vars.DOCKERHUB_USER }}/${{ vars.IMAGE_NAME }}:base
          file: base.Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
