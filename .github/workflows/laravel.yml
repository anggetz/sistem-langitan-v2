name: Auto-Merge & Deploy

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  auto_merge_pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.mergeable

    steps:
      - name: Auto-Merge Pull Request
        uses: pascalgn/automerge-action@v0.15.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: 'squash'

  deploy:
    runs-on: ubuntu-latest
    needs: auto_merge_pr # Memastikan job ini berjalan setelah auto-merge berhasil
    if: success() && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2246
          script: |
            # Ganti dengan path direktori proyek Anda di server
            cd /var/www/sistem-langitan-v2

            # Update kode dari git
            git pull origin develop

            echo "Deployment berhasil!"
